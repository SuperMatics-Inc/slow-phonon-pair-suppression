name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact replay and 25 mutants
        run: python -B replay.py --all-mutants
      - name: Prose style
        run: '! grep -n -e "—" -e "---" note/main.tex note/refs.bib README.md'
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: false
          build: false
      - name: Fetch pinned Mathlib cache and build
        working-directory: lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          for source in Base Linear Witness; do
            lake env lean "$source.lean" > "$source.axioms.txt"
            if grep -E 'sorryAx|sorry' "$source.axioms.txt"; then exit 1; fi
          done
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
      - name: Build manuscript and check references
        working-directory: note
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'Citation .* undefined|Reference .* undefined|undefined (references|citations)|Label\(s\) may have changed|Overfull \\hbox' main.log; then exit 1; fi
          pdftotext main.pdf main.txt
          tr -d ' \n' < main.txt > flat.txt
          for doi in 10.1007/BF02188657 10.1103/PhysRevB.109.L220502 10.1103/PhysRevX.13.011010 10.1007/BF01010398 10.1007/s10955-025-03446-5 10.1007/s10955-025-03468-z 10.1103/PhysRevX.9.031049 10.1103/PhysRevLett.39.1201 10.5281/zenodo.24366508 10.5281/zenodo.24366511; do
            grep -qF "$doi" flat.txt || { echo "Missing DOI in PDF: $doi"; exit 1; }
          done
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/slow-phonon-pair-suppression' urls.txt
          grep -qF 'https://doi.org/10.1103/PhysRevLett.39.1201' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24366508' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24366511' urls.txt
